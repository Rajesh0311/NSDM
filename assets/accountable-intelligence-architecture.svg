<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">From purpose to accountable execution</title><desc id="desc">Human purposes, decision science, models, NSDM boundaries, evidence and infrastructure connect as research responsibilities. ACE tests the execution path.</desc><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#f7f6f2"/><stop offset="1" stop-color="#eef4f3"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#102326" flood-opacity=".07"/></filter></defs><rect width="1200" height="760" rx="24" fill="url(#wash)"/><g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#102326"><text x="60" y="64" font-size="18" letter-spacing="3" fill="#01696f">NSDM / METAFORGEX AI</text><text x="60" y="116" font-size="34" font-weight="700">From purpose to accountable execution</text><g transform="translate(60 150)"><rect width="845" height="70" rx="12" fill="#fff" stroke="#d9dedb" filter="url(#shadow)"/><rect width="6" height="70" rx="3" fill="#01696f"/><text x="24" y="29" font-size="22" font-weight="600">Human purposes</text><text x="24" y="54" font-size="17" fill="#526468">Use cases · affected people · outcomes · acceptable risks</text></g><g transform="translate(60 234)"><rect width="845" height="70" rx="12" fill="#fff" stroke="#d9dedb" filter="url(#shadow)"/><rect width="6" height="70" rx="3" fill="#01696f"/><text x="24" y="29" font-size="22" font-weight="600">Decision and behavioural science</text><text x="24" y="54" font-size="17" fill="#526468">Uncertainty · incentives · decision quality · measurement validity</text></g><g transform="translate(60 318)"><rect width="845" height="70" rx="12" fill="#fff" stroke="#d9dedb" filter="url(#shadow)"/><rect width="6" height="70" rx="3" fill="#01696f"/><text x="24" y="29" font-size="22" font-weight="600">Intelligence and models</text><text x="24" y="54" font-size="17" fill="#526468">Neural · symbolic · hybrid · proposals rather than permission</text></g><g transform="translate(60 402)"><rect width="845" height="70" rx="12" fill="#fff" stroke="#d9dedb" filter="url(#shadow)"/><rect width="6" height="70" rx="3" fill="#d99b42"/><text x="24" y="29" font-size="22" font-weight="600">NSDM decision boundaries</text><text x="24" y="54" font-size="17" fill="#526468">Evidence · contradiction · abstention · action authority</text></g><g transform="translate(60 486)"><rect width="845" height="70" rx="12" fill="#fff" stroke="#d9dedb" filter="url(#shadow)"/><rect width="6" height="70" rx="3" fill="#01696f"/><text x="24" y="29" font-size="22" font-weight="600">Execution evidence</text><text x="24" y="54" font-size="17" fill="#526468">Identity · equivalence · lifecycle · resources · traces</text></g><g transform="translate(60 570)"><rect width="845" height="70" rx="12" fill="#fff" stroke="#d9dedb" filter="url(#shadow)"/><rect width="6" height="70" rx="3" fill="#01696f"/><text x="24" y="29" font-size="22" font-weight="600">Accelerated infrastructure</text><text x="24" y="54" font-size="17" fill="#526468">CPU · GPU · TPU · memory · network · cloud · data centre</text></g><rect x="940" y="150" width="200" height="490" rx="14" fill="#004b50"/><text x="967" y="190" font-size="28" fill="#fff" font-weight="700">ACE</text><text x="967" y="230" font-size="17" fill="#fff">Cross-cutting</text><text x="967" y="262" font-size="17" fill="#fff">execution</text><text x="967" y="294" font-size="17" fill="#fff">assessment</text><text x="967" y="326" font-size="17" fill="#fff"></text><text x="967" y="358" font-size="17" fill="#fff">Feasibility</text><text x="967" y="390" font-size="17" fill="#fff">Correctness</text><text x="967" y="422" font-size="17" fill="#fff">Provenance</text><text x="967" y="454" font-size="17" fill="#fff">Service objectives</text><text x="967" y="486" font-size="17" fill="#fff">Measured cost</text><text x="60" y="710" font-size="18" fill="#526468">Proposed research 